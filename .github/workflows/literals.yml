name: Lierals
on: push
jobs:
    print:
        runs-on: ubuntu-latest
        steps:
            - run: printenv | grep 'LITERAL_'
              env:
                    LITERAL_STRING: ${{ 'Hello'}}
                    LITERAL_OMIT_STRING: World
                    LITERAL_NUMBER: ${{ 123 }}
                    LITERAL_BOOLEAN: ${{ true }}
                    LITERAL_NULL: ${{ null }}