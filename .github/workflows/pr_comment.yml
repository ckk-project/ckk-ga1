name: PR Comment
on: pull_request
jobs:
    comment:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: read
        steps:
            - uses: actions/checkout@v4
            - run: gh pr comment ${GITHUB_HEAD_REF} --body "This is a test comment from the PR Comment workflow."
              env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
